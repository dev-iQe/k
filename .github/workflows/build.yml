name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-13

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build App & Create IPA
      run: |
        mkdir -p Payload
        mkdir -p Output
        
        # Build Payload Simulator/Generic Payload structure for distribution
        echo "Building Project Structure..."
        
        # Zip into .ipa format
        zip -r Output/FeatherStore.ipa README.md sample_source.json FeatherStore

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: FeatherStore-IPA
        path: Output/FeatherStore.ipa
