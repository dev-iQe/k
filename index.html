<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feather Web Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        <!-- Header -->
        <div class="glass p-4 rounded-2xl flex justify-between items-center">
            <h1 class="text-xl font-bold">Feather Web Store</h1>
            <button onclick="openAddSourceModal()" class="bg-blue-600 px-3 py-1.5 rounded-xl text-sm font-semibold">+ سورس</button>
        </div>

        <!-- Sources List -->
        <div id="sourcesContainer" class="space-y-3">
            <!-- Dynamic Apps will load here -->
        </div>
    </div>

    <!-- Add Source Modal -->
    <div id="sourceModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass p-6 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-lg font-bold">إضافة سورس جديد</h3>
            <input type="url" id="sourceUrlInput" placeholder="أدخل رابط الـ JSON للسورس..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm focus:outline-none focus:border-blue-500">
            <div class="flex space-x-2 space-x-reverse">
                <button onclick="addSource()" class="flex-1 bg-blue-600 py-2 rounded-xl font-semibold">إضافة</button>
                <button onclick="closeAddSourceModal()" class="flex-1 bg-slate-700 py-2 rounded-xl font-semibold">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let sources = JSON.parse(localStorage.getItem('feather_sources')) || [
            "https://raw.githubusercontent.com/dev-iQe/k/main/sample_source.json"
        ];

        async function loadApps() {
            const container = document.getElementById('sourcesContainer');
            container.innerHTML = '<p class="text-center text-slate-400">جاري التحميل...</p>';
            container.innerHTML = '';

            for (let url of sources) {
                try {
                    let res = await fetch(url);
                    let data = await res.json();
                    
                    let section = document.createElement('div');
                    section.innerHTML = `<h2 class="text-sm font-semibold text-slate-400 mb-2">${data.name || 'سورس'}</h2>`;
                    
                    let appsList = document.createElement('div');
                    appsList.className = "space-y-2";

                    data.apps.forEach(app => {
                        let appCard = document.createElement('div');
                        appCard.className = "glass p-3 rounded-2xl flex items-center justify-between";
                        appCard.innerHTML = `
                            <div class="flex items-center space-x-3 space-x-reverse">
                                <img src="${app.iconURL}" class="w-12 h-12 rounded-xl object-cover">
                                <div>
                                    <h4 class="font-bold text-sm">${app.name}</h4>
                                    <p class="text-xs text-slate-400">${app.version}</p>
                                </div>
                            </div>
                            <a href="${app.downloadURL}" class="bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold">تحميل</a>
                        `;
                        appsList.appendChild(appCard);
                    });

                    section.appendChild(appsList);
                    container.appendChild(section);
                } catch (e) {
                    console.error("Error loading source", e);
                }
            }
        }

        function openAddSourceModal() { document.getElementById('sourceModal').classList.remove('hidden'); }
        function closeAddSourceModal() { document.getElementById('sourceModal').classList.add('hidden'); }
        
        function addSource() {
            let url = document.getElementById('sourceUrlInput').value.trim();
            if (url) {
                sources.push(url);
                localStorage.setItem('feather_sources', JSON.stringify(sources));
                closeAddSourceModal();
                loadApps();
            }
        }

        loadApps();
    </script>
</body>
</html>
